<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Public projects by feesh42.">
    <meta name="theme-color" content="#f9f9f7">
    <script>
      try {
        const theme = localStorage.getItem('portfolio-theme');
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <title>Projects · feesh42</title>
  </head>
  <body>
    <header class="site-header shell">
      <a class="identity" href="/" data-route><span class="mark" aria-hidden="true"></span>feesh42</a>
      <div class="header-end">
        <a class="profile" target="_blank" rel="noopener" href="https://github.com/feesh42">GitHub <span aria-hidden="true">↗</span></a>
        <button class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false">
          <span class="theme-moon" aria-hidden="true">☾</span>
          <span class="theme-sun" aria-hidden="true">☼</span>
        </button>
      </div>
    </header>
    <main id="catalog" class="shell">
      <div class="hero">
        <h1 tabindex="-1">PROJECTS<span>.</span></h1>
        <p>Public projects by feesh42.</p>
      </div>
      <section class="project-section" aria-labelledby="projects-heading">
        <div class="section-heading">
          <h2 id="projects-heading">Projects</h2>
          <span id="project-count"></span>
        </div>
        <div id="projects" class="projects"></div>
        <noscript><p>Browse the projects on <a target="_blank" rel="noopener" href="https://github.com/feesh42?tab=repositories">GitHub</a>.</p></noscript>
      </section>
    </main>
    <main id="project-detail" class="detail" hidden>
      <div class="detail-backdrop" aria-hidden="true"></div>
      <div class="shell detail-content">
        <a class="detail-back" href="/" data-route>← Back to project overview</a>
        <h1 id="detail-title" tabindex="-1"></h1>
        <p class="detail-loading" role="status" hidden>Loading…</p>
        <div class="detail-links" hidden>
          <a class="detail-source" target="_blank" rel="noopener" hidden><span></span></a>
          <a class="action action-primary detail-visit" target="_blank" rel="noopener" hidden>Visit ↗</a>
        </div>
        <div class="detail-summary" hidden>
          <p></p>
          <div class="detail-preview"></div>
        </div>
      </div>
    </main>
    <footer class="shell site-footer">
      <span>feesh42</span>
      <a target="_blank" rel="noopener" href="https://github.com/feesh42?tab=repositories">All repositories <span aria-hidden="true">↗</span></a>
    </footer>
    <template id="project-template">
      <article class="tile">
        <div class="card">
          <div class="tile-cover">
            <div class="art" aria-hidden="true"><div class="motif"><i></i><i></i><i></i></div></div>
            <h3 class="tile-title"><a class="project-title" data-route></a></h3>
          </div>
          <a class="github-shortcut" target="_blank" rel="noopener"></a>
          <div class="card-copy">
            <div class="tile-footer">
              <p class="tile-description"></p>
              <div class="tile-actions">
                <a class="visit" target="_blank" rel="noopener">Visit</a>
                <a class="info" data-route>Info</a>
              </div>
            </div>
          </div>
        </div>
      </article>
    </template>
    <template id="github-icon">
      <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
        <path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.49c-2.23.48-2.7-.95-2.7-.95-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.82 1.23.82.72 1.22 1.88.87 2.34.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.58.82-2.14-.08-.2-.36-1.01.08-2.11 0 0 .67-.21 2.2.82a7.7 7.7 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.91.08 2.11.51.56.82 1.27.82 2.14 0 3.07-1.87 3.75-3.65 3.95.29.25.54.74.54 1.49l-.01 2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/>
      </svg>
    </template>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
